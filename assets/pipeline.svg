<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Homelab GitOps pipeline</title>
  <desc id="desc">Git, then GitHub Actions over Tailscale, OpenTofu provisioning Proxmox VMs, Ansible configuration, a k3s cluster, and Flux reconciling workloads with SOPS-encrypted secrets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#060A13"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1A2540"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="250" rx="16"/>
    </clipPath>
    <g id="check">
      <circle r="9" fill="#0F2A24" stroke="#34D399" stroke-width="1.2"/>
      <path d="M -4 0.5 L -1.2 3.2 L 4.2 -2.8" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .card { fill: #0E1729; stroke: #22314F; stroke-width: 1.2; animation: glow 6s ease-out infinite; }
    .tick { stroke: #22314F; stroke-width: 1.2; }
    .stop { fill: #0B1324; stroke: #2A3A5C; stroke-width: 1.5; animation: hit 6s ease-out infinite; }
    .step { fill: #22D3EE; font-size: 11px; }
    .stage { fill: #5B6B88; font-size: 11px; letter-spacing: 1.5px; }
    .tool { fill: #F1F5FB; font-size: 17px; font-weight: 600; }
    .cap { fill: #8B9BB4; font-size: 11px; }
    .d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; } .d3 { animation-delay: 3s; } .d4 { animation-delay: 4s; } .d5 { animation-delay: 5s; }
    @keyframes glow { 0% { stroke: #22D3EE; } 14%, 100% { stroke: #22314F; } }
    @keyframes hit { 0% { stroke: #22D3EE; fill: #22D3EE; } 14%, 100% { stroke: #2A3A5C; fill: #0B1324; } }
    @media (prefers-reduced-motion: reduce) { .card, .stop { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="250" fill="url(#bg)"/>
    <rect width="1200" height="250" fill="url(#dots)"/>

    <!-- header -->
    <text x="42" y="38" class="mono" font-size="13"><tspan fill="#22D3EE">homelab</tspan><tspan fill="#3B4A66"> / </tspan><tspan fill="#E6EDF7">gitops-pipeline</tspan><tspan fill="#5B6B88" dx="18">on: push → main</tspan></text>
    <rect x="1062" y="21" width="96" height="24" rx="12" fill="#0F2A24" stroke="#1F5A48"/>
    <circle cx="1080" cy="33" r="4" fill="#34D399"/>
    <text x="1092" y="37.5" class="mono" font-size="12" fill="#34D399">passing</text>

    <!-- track -->
    <line x1="125" y1="222" x2="1075" y2="222" stroke="#1B2742" stroke-width="2"/>
    <line x1="125" y1="222" x2="1075" y2="222" stroke="url(#track)" stroke-width="2" stroke-opacity="0.35"/>

    <g class="mono">
      <!-- 01 -->
      <rect x="42" y="66" width="166" height="128" rx="12" class="card"/>
      <use href="#check" x="188" y="88"/>
      <text x="58" y="92" class="step">01<tspan class="stage" dx="8">SOURCE</tspan></text>
      <text x="58" y="128" class="sans tool">Git</text>
      <text x="58" y="154" class="cap">one repo, every</text>
      <text x="58" y="170" class="cap">layer of the stack</text>
      <line x1="125" y1="194" x2="125" y2="222" class="tick"/>
      <circle cx="125" cy="222" r="5" class="stop"/>

      <!-- 02 -->
      <rect x="232" y="66" width="166" height="128" rx="12" class="card d1"/>
      <use href="#check" x="378" y="88"/>
      <text x="248" y="92" class="step">02<tspan class="stage" dx="8">CI/CD</tspan></text>
      <text x="248" y="128" class="sans tool" style="font-size:16px">GitHub Actions</text>
      <text x="248" y="154" class="cap">plan on PR, apply</text>
      <text x="248" y="170" class="cap">over a tailnet node</text>
      <line x1="315" y1="194" x2="315" y2="222" class="tick"/>
      <circle cx="315" cy="222" r="5" class="stop d1"/>

      <!-- 03 -->
      <rect x="422" y="66" width="166" height="128" rx="12" class="card d2"/>
      <use href="#check" x="568" y="88"/>
      <text x="438" y="92" class="step">03<tspan class="stage" dx="8">PROVISION</tspan></text>
      <text x="438" y="128" class="sans tool">OpenTofu</text>
      <text x="438" y="154" class="cap">Proxmox VMs from a</text>
      <text x="438" y="170" class="cap">cloud-init template</text>
      <line x1="505" y1="194" x2="505" y2="222" class="tick"/>
      <circle cx="505" cy="222" r="5" class="stop d2"/>

      <!-- 04 -->
      <rect x="612" y="66" width="166" height="128" rx="12" class="card d3"/>
      <use href="#check" x="758" y="88"/>
      <text x="628" y="92" class="step">04<tspan class="stage" dx="8">CONFIGURE</tspan></text>
      <text x="628" y="128" class="sans tool">Ansible</text>
      <text x="628" y="154" class="cap">base OS, Tailscale,</text>
      <text x="628" y="170" class="cap">k3s install</text>
      <line x1="695" y1="194" x2="695" y2="222" class="tick"/>
      <circle cx="695" cy="222" r="5" class="stop d3"/>

      <!-- 05 -->
      <rect x="802" y="66" width="166" height="128" rx="12" class="card d4"/>
      <use href="#check" x="948" y="88"/>
      <text x="818" y="92" class="step">05<tspan class="stage" dx="8">CLUSTER</tspan></text>
      <text x="818" y="128" class="sans tool">k3s</text>
      <text x="818" y="154" class="cap">1 server · 2 agents</text>
      <text x="818" y="170" class="cap">private by default</text>
      <line x1="885" y1="194" x2="885" y2="222" class="tick"/>
      <circle cx="885" cy="222" r="5" class="stop d4"/>

      <!-- 06 -->
      <rect x="992" y="66" width="166" height="128" rx="12" class="card d5"/>
      <use href="#check" x="1138" y="88"/>
      <text x="1008" y="92" class="step">06<tspan class="stage" dx="8">DELIVER</tspan></text>
      <text x="1008" y="128" class="sans tool">Flux</text>
      <text x="1008" y="154" class="cap">GitOps reconcile,</text>
      <text x="1008" y="170" class="cap">SOPS + age secrets</text>
      <line x1="1075" y1="194" x2="1075" y2="222" class="tick"/>
      <circle cx="1075" cy="222" r="5" class="stop d5"/>
    </g>

    <!-- packet: reaches stage n at t = n seconds, rests, loops every 6s -->
    <circle cx="125" cy="222" r="4" fill="#22D3EE">
      <animate attributeName="cx" values="125;1075;1075" keyTimes="0;0.8333;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8333;0.85;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="16" fill="none" stroke="#1E2A44"/>
</svg>
